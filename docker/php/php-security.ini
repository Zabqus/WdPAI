; Hide PHP version from response headers
expose_php = Off

; Never display errors to end users
display_errors = Off
display_startup_errors = Off

; Log errors instead (writes to PHP-FPM log)
log_errors = On

; Enforce strict session IDs — reject uninitialized sessions
session.use_strict_mode = 1

; Backup for cookie flags set in Session.php
session.cookie_httponly = 1
session.cookie_samesite = Lax

; Match the 30-minute inactivity timeout enforced in Session.php
session.gc_maxlifetime = 1800

; Use only cookies for session tracking — no session IDs in URLs
session.use_only_cookies = 1
session.use_trans_sid = 0
